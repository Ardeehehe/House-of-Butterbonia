<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The House of Butterbonia — Enter</title><link rel="stylesheet" href="pages.css"><style>
body{min-height:100vh;display:grid;place-items:center;background:#030305 url("butterbonia-background.jpg") center/cover fixed;position:relative}body:before{content:"";position:fixed;inset:0;background:linear-gradient(115deg,rgba(3,3,5,.94),rgba(45,0,12,.82));z-index:-1}.entry-shell{width:min(560px,90%);padding:42px;border:1px solid rgba(255,255,255,.16);background:rgba(5,5,8,.82);box-shadow:0 0 80px rgba(255,24,63,.16);backdrop-filter:blur(16px);animation:entryIn .8s ease both}.entry-mark{height:150px;border:1px solid rgba(255,24,63,.45);display:grid;place-items:center;margin-bottom:30px;position:relative;overflow:hidden}.entry-mark:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,24,63,.12) 0 1px,transparent 1px 5px);animation:scan 5s linear infinite}.entry-symbol{position:relative;color:var(--red);font:600 72px "Space Grotesk";text-shadow:0 0 22px rgba(255,24,63,.7);animation:pulse 3s ease-in-out infinite}.entry-mark.is-loading .entry-symbol{animation:scanPulse 1.1s ease-in-out infinite}.entry-mark.is-denied .entry-symbol{color:#ff7a7a;animation:deniedFlash .55s ease-in-out 2}.entry-shell h1{font:600 clamp(32px,6vw,58px) "Space Grotesk";line-height:.9;letter-spacing:-.07em;margin:0 0 14px}.entry-shell h1 span{color:var(--red)}.entry-copy{color:#999;font-size:12px;line-height:1.8;margin-bottom:26px}.entry-form{display:grid;gap:12px}.entry-form input{width:100%}.robot-check{display:flex;align-items:center;gap:10px;color:#aaa;font-size:11px;border:1px solid #29292d;padding:14px}.robot-check input{width:16px;height:16px;accent-color:var(--red)}.entry-status{min-height:16px;color:var(--red);font:9px "Space Grotesk";letter-spacing:1px;transition:color .25s ease, opacity .25s ease}.entry-status.status-loading{color:#ffb3ba}.entry-status.status-success{color:#7ef7b4}.entry-status.status-error{color:#ff7a7a}.entry-form .btn{width:100%}.entry-form .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}@keyframes entryIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes scan{to{transform:translateY(60px)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.3)}}@keyframes scanPulse{0%,100%{transform:scale(1);opacity:1;filter:brightness(1)}50%{transform:scale(1.12);opacity:.8;filter:brightness(1.4)}}@keyframes deniedFlash{0%,100%{transform:translateX(0);opacity:1}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}@media(max-width:600px){.entry-shell{padding:25px}.entry-mark{height:120px}}
</style></head><body><script>sessionStorage.removeItem('butterboniaAccess');</script>
<main class="entry-shell"><div class="entry-mark"><span class="entry-symbol">⌁</span></div><div class="eyebrow">SECURE ENTRY / BUTTERBONIA NETWORK</div><h1>Enter the <span>house.</span></h1><p class="entry-copy">Authenticate your signal before entering The House of Butterbonia.</p><form class="entry-form" id="entry-form"><input id="entry-password" type="password" placeholder="ENTER PASSWORD" required autocomplete="off"><label class="robot-check"><input id="robot-check" type="checkbox"> I’m not a robot</label><button class="btn red" type="submit" disabled>Enter the house ↗</button><small class="entry-status" id="entry-status"></small></form></main><script>
const form=document.getElementById('entry-form');
const password=document.getElementById('entry-password');
const robot=document.getElementById('robot-check');
const button=form.querySelector('button');
const status=document.getElementById('entry-status');
const entryMark=document.querySelector('.entry-mark');
const correctPassword='BUTTERBONIA';
const simulatedPassword = correctPassword;

function setStatus(type,message){
  status.className='entry-status';
  if(type){status.classList.add('status-'+type)}
  status.textContent=message;
}

function simulateTyping(targetText, onComplete){
  let i=0;
  password.value='';
  password.disabled=false;
  robot.checked=true;
  robot.disabled=true;
  button.disabled=true;
  entryMark.classList.remove('is-denied');
  entryMark.classList.add('is-loading');
  setStatus('loading','AUTHENTICATING SIGNAL...');

  const timer=setInterval(() => {
    password.value = targetText.slice(0, i + 1);
    i += 1;
    if (i >= targetText.length) {
      clearInterval(timer);
      onComplete();
    }
  }, 120);
}

form.addEventListener('submit', event => event.preventDefault());
password.value='';
password.disabled=true;
robot.checked=true;
robot.disabled=true;
button.disabled=true;
button.textContent='VERIFYING...';

setTimeout(() => {
  simulateTyping(simulatedPassword, () => {
    setTimeout(() => {
      const isCorrect = simulatedPassword.toLowerCase() === correctPassword.toLowerCase();

      if (isCorrect) {
        entryMark.classList.remove('is-loading');
        setStatus('success','SIGNAL VERIFIED — OPENING HOUSE...');
        button.textContent='ACCESS GRANTED';
        sessionStorage.setItem('butterboniaAccess','granted');
        setTimeout(() => { window.location.href='index.html'; }, 900);
        return;
      }

      entryMark.classList.remove('is-loading');
      entryMark.classList.add('is-denied');
      setStatus('error','ACCESS DENIED — LOADING INCOMPLETE');
      button.textContent='LOADING...';
      button.disabled=true;
      password.disabled=true;
      robot.disabled=true;
    }, 700);
  });
}, 600);
</script></body></html>
